<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b1524"><title>点阵飞行 · 无人机灯光秀</title>
<link rel="stylesheet" href="./style.css">
<script type="importmap">{"imports":{"three":"./vendor/three.module.min.js","three/addons/":"./vendor/examples/jsm/"}}</script>
</head>
<body>
<header><h1>点阵飞行</h1><span><i></i><span id="drone-total">1,000 架</span></span></header>
<main>
<aside>
<h2>模型与编队</h2>
<div class="upload-group">
<button id="upload" class="upload"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16V3m-5 5 5-5 5 5M4 15v5a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-5"/></svg>上传 GLB</button>
<input id="file" type="file" accept=".glb" hidden>
<p class="hint">选择本地三维模型 · 文件仅在本机处理</p>
<p id="filename" class="filename" hidden></p>
</div>
<section class="lineart-section">
<button id="line-upload">上传二维线稿</button><input id="line-file" type="file" accept="image/png,image/jpeg,image/webp" hidden>
<p id="line-name" class="filename">未上传线稿</p>
<div class="field"><label for="line-mode">线条颜色</label><select id="line-mode"><option value="dark">深色线条 / 浅色底</option><option value="light">浅色线条 / 深色底</option></select></div>
<div class="field"><label for="line-threshold">识别阈值 <output id="line-threshold-value">160</output></label><input id="line-threshold" type="range" min="1" max="254" value="160"></div>
<p class="hint">PNG / JPG / WebP · 支持透明背景。沿线条区域布点，生成平面点阵；调整阈值可重新识别。</p>
</section>
<div class="field"><label for="formation">编队类型</label><select id="formation"><option value="sphere">球形编队</option><option value="helix">螺旋编队</option><option value="cube">立方体编队</option><option value="lineart" disabled>二维线稿点阵</option><option value="model" disabled>上传的模型</option></select></div>
<div class="field"><label for="count">无人机数量 / 点阵数量</label><div class="duration"><input id="count" type="number" min="1" max="10000" value="1000" step="1"><span>架</span></div><p class="hint">1–10,000 架 · 修改后自动重新生成点阵</p></div>
<div class="field"><label for="light-color">灯光颜色 RGB</label><input id="light-color" type="color" value="#00ccff" aria-label="选择灯光颜色"><div class="rgb-inputs"><label>R<input id="red" type="number" min="0" max="255" step="1" value="0"></label><label>G<input id="green" type="number" min="0" max="255" step="1" value="204"></label><label>B<input id="blue" type="number" min="0" max="255" step="1" value="255"></label></div><p class="hint">0–255 · 实时应用于全部光点</p></div>
<div class="field"><label for="duration">飞行时长</label><div class="duration"><input id="duration" type="number" min="3" max="60" value="12" step="1"><span>s</span></div></div>
<label class="toggle-row" for="reference"><span>显示参考模型</span><input id="reference" type="checkbox" disabled role="switch"><span class="switch" aria-hidden="true"></span></label>
<section class="media-section" aria-label="背景与导出">
<h2>背景与导出</h2>
<div class="media-actions"><button id="background-upload">上传背景图片</button><button id="background-remove" disabled>移除</button></div>
<input id="background-file" type="file" accept="image/png,image/jpeg,image/webp" hidden>
<p id="background-name" class="filename">未设置背景</p>
<p class="hint">图片等比铺满场景，超出部分居中裁切；上传后隐藏地面网格。</p>
<div class="media-actions export-row"><select id="image-format" aria-label="图片导出格式"><option value="image/png">PNG 图片</option><option value="image/jpeg">JPG 图片</option></select><button id="export-image">导出图片</button></div>
<button id="record-video">录制视频</button>
<p id="video-hint" class="hint"></p><p id="record-status" role="status" aria-live="polite"></p>
</section>
<p id="message" role="status" aria-live="polite">示例编队已就绪。上传 GLB 可生成模型点阵。</p>
<p class="simulation-note">可视化演示 · 不含真实飞控航线</p>
</aside>
<section class="workspace" aria-label="三维点阵场景">
<div id="viewport"><button id="reset-view" title="恢复默认视角" aria-label="恢复默认视角"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10a9 9 0 1 1 2 8M3 4v6h6"/></svg></button><div id="fatal" role="alert" hidden></div><span id="phase">编队就绪</span></div>
<div class="playback">
<button id="play" class="primary"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m8 5 11 7-11 7Z"/></svg><span>播放</span></button>
<button id="restart"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10a9 9 0 1 1 2 8M3 4v6h6"/></svg><span>重新编队</span></button>
<div class="timeline"><input id="progress" type="range" min="0" max="1000" value="1000" aria-label="飞行进度"><output id="time" for="progress">12.0 / 12 s</output></div>
<span class="navigation-hint">拖动旋转 · 滚轮缩放</span>
</div>
</section>
</main>
<script>
/* 启动自检：本页依赖 ES 模块与本机服务，用 file:// 直接打开时浏览器会拦截模块脚本，
   页面看起来正常但所有按钮都无反应，且模块内的错误提示也无法执行。
   这里用内联经典脚本（不受模块限制）给出明确指引，避免"点了没反应"的静默失败。 */
(function(){
  var URL_HINT='http://127.0.0.1:4178';
  function showHelp(reason){
    if(document.getElementById('boot-help'))return;
    var box=document.createElement('div');box.id='boot-help';box.setAttribute('role','alert');
    var title=document.createElement('strong');
    title.textContent=reason==='file'?'需要通过本地服务打开，而不是双击文件':'页面脚本没有正常启动';
    var p1=document.createElement('p');
    p1.textContent=reason==='file'
      ?'当前地址是 file://，浏览器会拦截 JavaScript 模块，所以按钮点了不会有任何反应。'
      :'三维场景未能初始化，请确认本地服务正在运行后刷新页面。';
    var p2=document.createElement('p');p2.className='boot-help-steps';
    var s1=document.createElement('span');s1.textContent='① 在项目目录执行 ';
    var c1=document.createElement('code');c1.textContent='npm start';
    var s2=document.createElement('span');s2.textContent='，或双击 ';
    var c2=document.createElement('code');c2.textContent='启动点阵飞行.command';
    var s3=document.createElement('span');s3.textContent='；② 打开 ';
    var c3=document.createElement('code');c3.textContent=URL_HINT;
    p2.append(s1,c1,s2,c2,s3,c3);
    var btn=document.createElement('button');btn.type='button';btn.textContent='复制地址';
    btn.onclick=function(){
      var done=function(){btn.textContent='已复制';setTimeout(function(){btn.textContent='复制地址';},1600);};
      if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(URL_HINT).then(done,done);
      else done();
    };
    box.append(title,p1,p2,btn);
    document.body.insertBefore(box,document.body.firstChild);
  }
  var isFile=location.protocol==='file:';
  window.addEventListener('DOMContentLoaded',function(){
    if(isFile)showHelp('file');
  });
  if(isFile)setTimeout(function(){showHelp('file');},0);
  /* 兜底：无论什么原因，只要 3 秒后场景仍未初始化且没有其他错误提示，就给出可操作指引 */
  window.addEventListener('load',function(){
    setTimeout(function(){
      var fatal=document.getElementById('fatal');
      if(!document.querySelector('#viewport canvas')&&!(fatal&&!fatal.hidden))showHelp('boot');
    },3000);
  });
})();
</script>
<script type="module" src="./bootstrap.js"></script>
</body></html>
